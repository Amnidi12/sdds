name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"

defaults:
  run:
    working-directory: apps/api

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install aiosqlite

      - name: Ruff lint (fail on real errors only)
        run: ruff check app/ --select=E9,F

      - name: Black format check
        run: black --check app/ scripts/ tests/

      - name: Run tests (SQLite, isolated - no external services required)
        env:
          APP_SECRET: ci-test-secret-not-for-production
          DATABASE_URL: sqlite+aiosqlite:///:memory:
        run: pytest tests/ -v

  build-check:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (build validation only, not pushed)
        run: docker build -t sddt-api:ci-check ./apps/api
